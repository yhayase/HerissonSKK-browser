<!doctype html>
<html lang="ja"><meta charset="utf-8"><title>HerissonSKK 入力デモ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f2ee;color:#28332e;font-family:system-ui,sans-serif}main{width:1040px;margin:52px auto}.brand{display:flex;align-items:center;gap:18px;font-size:20px;font-weight:650}.brand img{width:68px;height:68px}h1{font-size:42px;letter-spacing:.02em;margin:24px 0 12px}p{font-size:18px;line-height:1.8;margin:0;color:#526058}.editor{margin-top:32px;background:#fff;border:1px solid #d7dfd6;border-radius:18px;padding:30px;box-shadow:0 10px 35px #26332a08}label{display:block;font-size:14px;letter-spacing:.08em;color:#60716a;margin-bottom:14px}textarea{width:100%;height:195px;border:1px solid #9fac9f;border-radius:8px;padding:20px;font:22px/1.8 system-ui,sans-serif;resize:none;color:#28332e;outline-color:#477257}.keys{display:flex;gap:28px;margin-top:26px;font-size:15px;color:#526058}kbd{font:14px system-ui,sans-serif;background:#fff;border:1px solid #b5bfb4;border-radius:5px;padding:4px 8px;margin-right:7px}footer{margin-top:28px;font-size:13px;color:#6c756e}
</style>
<main><div class="brand"><img src="/icon.png" alt="">HerissonSKK</div>
<h1 id="heading">いつもの入力欄で、SKK。</h1><p id="description">読みの先頭を Shift で入力。Space で候補を選び、日本語を入力できます。</p>
<section class="editor"><label for="note">メモ — 入力デモ</label><textarea id="note" spellcheck="false" aria-label="メモ"></textarea></section>
<div class="keys"><span><kbd>Ctrl + J</kbd>かな入力</span><span><kbd>Space</kbd>変換・次の候補</span><span><kbd>Ctrl + G</kbd>キャンセル</span></div>
<footer>初回に基本辞書を取得。取得後の変換・単語登録はブラウザー内で処理します。</footer></main></html>
